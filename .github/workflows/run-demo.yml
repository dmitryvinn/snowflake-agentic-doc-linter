name: Run Agentic Documentation Demo

on:
  workflow_dispatch:
    inputs:
      max_files:
        description: Maximum number of documentation files to scan
        required: true
        default: "50"
        type: string

permissions:
  contents: read

jobs:
  demo:
    name: Scan Snowflake documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run recursive fleet scanner
        env:
          MAX_FILES: ${{ inputs.max_files }}
        run: python agent_fleet_linter.py --max-files "$MAX_FILES"
